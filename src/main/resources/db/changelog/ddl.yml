databaseChangeLog:
  - changeSet:
      id: "main_tables_26.12.2024_19:57"
      context: ddl
      author: owpk
      changes:
         - createTable:
            tableName: domain_user
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar
              - column:
                  name: last_name
                  type: varchar
              - column:
                  name: middle_name
                  type: varchar
              - column:
                  name: login
