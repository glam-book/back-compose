                 constraints:
                   primaryKey: true
             - column:
                 name: telegram_id
                 type: varchar
                 constraints:
                   primaryKey: true
         - createTable:
             tableName: user_role
             columns:
             - column:
                 name: user_id
                 type: bigint
                 constraints:
                   primaryKey: true
             - column:
                 name: role_id
                 type: bigint
                 constraints:
                   primaryKey: true
         - createTable:
             tableName: role
