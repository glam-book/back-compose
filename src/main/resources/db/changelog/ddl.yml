databaseChangeLog:
    - changeSet:
        id: "main_tables_26.12.2024_19:57"
        context: ddl
        author: owpk
        changes:
           - createTable:
              tableName: "domain_user"
              columns:
                - column:
                    name: id
                    type: bigserial
                    constraints:
                      primaryKey: true
                - column:
                    name: name
                    type: varchar
                - column:
                    name: last_name
                    type: varchar
                - column:
                    name: middle_name
                    type: varchar
                - column:
                    name: login
                    type: varchar
           - createTable:
               tableName: telegram_user
               columns:
                 - column:
                     name: user_id
                     type: bigint
                     constraints:
                       nullable: false
                 - column:
                     name: id
                     type: bigint
                     constraints:
                       nullable: false
                 - column:
                     name: first_name
                     type: varchar(255)
                     constraints:
                       nullable: false
                 - column:
                     name: is_bot
                     type: boolean
                 - column:
                     name: last_name
                     type: varchar(255)
                 - column:
                     name: username
                     type: varchar(255)
                 - column:
                     name: language_code
                     type: varchar(255)
                 - column:
                     name: is_premium
                     type: boolean
                 - column:
                     name: added_to_attachment_menu
                     type: boolean
                 - column:
                     name: allows_write_to_pm
                     type: boolean
                 - column:
                     name: photo_url
                     type: varchar(255)

           - createTable:
               tableName: user_role
               columns:
               - column:
                   name: user_id
                   type: bigint
                   constraints:
                     primaryKey: true
               - column:
                   name: role_id
                   type: bigint
                   constraints:
                     primaryKey: true
           - createTable:
               tableName: role
               columns:
                 - column:
                     name: id
                     type: bigserial
                     constraints:
                       primaryKey: true
                 - column:
                     name: name
                     type: varchar
           - createTable:
               tableName: service_info
               columns:
                 - column:
                     name: id
                     type: bigserial
                     constraints:
                       primaryKey: true
                 - column:
                     name: service_name
                     type: varchar(75)
                 - column:
                     name: editable
                     type: boolean
                 - column:
                     name: service_description
                     type: text
                 - column:
                     name: time_duration
                     type: int
           - createTable:
               tableName: record
               columns:
                 - addColumn:
                     tableName: record
                     columns:
                       - column:
                           name: rec_limit
                           type: integer
                           constraints:
                             nullable: true
                           defaultValue: "0"
                 - column:
                     name: id
                     type: bigserial
                     constraints:
                       primaryKey: true
                       intitiallyDeffered: false
                 - column:
                     name: service_info_id
                     type: bigint
                 - column:
                     name: record_owner_id
                     type: bigint
                 - column:
                     name: is_public
                     type: boolean
                 - column:
                     name: ts_from
                     type: timestamp
                 - column:
                     name: ts_to
                     type: timestamp
                 - column:
                     name: tz
                     type: varchar(8)
           - createTable:
               tableName: record_pending
               columns:
                 - column:
                     name: record_id
                     type: bigint
                     constraints:
                       primaryKey: true
                 - column:
                     name: client_id
                     type: bigint
                     constraints:
                       primaryKey: true
                 - column:
                     name: request_time
                     type: timestamp
                 - column:
                     name: confirmed
                     type: boolean
           - addPrimaryKey:
               tableName: telegram_user
               columnNames: "id, user_id"
               constraintName: "pk_tg_pk"

           - addUniqueConstraint:
               tableName: service_info
               columnNames: id, service_owner_id
           - createIndex:
               tableName: record
               columns:
                 - column:
                     name: record_owner_id
                 - column:
                     name: service_info_id
           - addForeignKeyConstraint:
               constraintName: "fk_telegram_user_user_id"
               baseTableName: telegram_user
               baseColumnNames: user_id
               referencedTableName: domain_user
               referencedColumnNames: id
           - addForeignKeyConstraint:
               constraintName: "fk_user_role_user_id"
               baseTableName: user_role
               baseColumnNames: user_id
               referencedTableName: domain_user
               referencedColumnNames: id
           - addForeignKeyConstraint:
               constraintName: "fk_user_role_role_id"
               baseTableName: user_role
               baseColumnNames: role_id
               referencedTableName: role
               referencedColumnNames: id
           - addForeignKeyConstraint:
               constraintName: "fk_service_info_service_owner_id"
               baseTableName: service_info
               baseColumnNames: service_owner_id
               referencedTableName: domain_user
               referencedColumnNames: id
           - addForeignKeyConstraint:
               constraintName: "fk_record_service_info_id"
               baseTableName: record
               baseColumnNames: service_info_id
               referencedTableName: service_info
               referencedColumnNames: id
           - addForeignKeyConstraint:
               constraintName: "fk_record_record_owner_id"
               baseTableName: record
               baseColumnNames: record_owner_id
               referencedTableName: domain_user
               referencedColumnNames: id
           - addForeignKeyConstraint:
               constraintName: "fk_record_pending_record_id"
               baseTableName: record_pending
               baseColumnNames: record_id
               referencedTableName: record
               referencedColumnNames: id
           - addForeignKeyConstraint:
               constraintName: "fk_record_pending_client_id"
               baseTableName: record_pending
               baseColumnNames: client_id
               referencedTableName: domain_user
               referencedColumnNames: id
    - changeSet:
        id: make-record-pending-cascade
        author: owpk
        context: indx
        changes:
          - dropForeignKeyConstraint:
              baseTableName: record_pending
              constraintName: "fk_record_pending_record_id"
          - addForeignKeyConstraint:
              constraintName: "fk_record_pending_record_id"
              baseTableName: record_pending
              baseColumnNames: record_id
              referencedTableName: record
              referencedColumnNames: id
              onDelete: CASCADE
    - changeSet:
        id: add_comment_col
        author: owpk
        context: ddl
        changes:
          - addColumn:
              tableName: record
              columns:
                - column:
                    name: comment
                    type: text
                    remarks: "Комментарий к записи"
                    constraints:
                      nullable: true
    - changeSet:
        id: add_service_colls
        author: owpk
        context: ddl
        changes:
          - addColumn:
              tableName: service_info
              columns:
                - column:
                    name: url
                    type: text
                    constraints:
                      nullable: true
                - column:
                    name: icon
                    type: text
                    constraints:
                      nullable: true
    - changeSet:
        id: refactor-records
        author: owpk
        context: ddl
        changes:
        - createTable:
            tableName: record_to_service
            columns:
            - column:
                name: record_id
                type: bigint
                constraints:
                  nullable: false
            - column:
                name: service_id
                type: bigint
                constraints:
                  nullable: false
            - column:
                name: created_at
                type: timestamp
                defaultValue: now()
        - addPrimaryKey:
            tableName: record_to_service
            columnNames: record_id, service_id
            constraintName: pk_record_to_service

    - changeSet:
        id: refactor-records-fk
        author: owpk
        context: indx # исключаем из контекста jooq
        changes:
        - addForeignKeyConstraint:
            baseTableName: record_to_service
            baseColumnNames: record_id
            referencedTableName: record
            referencedColumnNames: id
            constraintName: fk_record_to_service_record
            deferrable: true
            initiallyDeferred: true
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: record_to_service
            baseColumnNames: service_id
            referencedTableName: service_info
            referencedColumnNames: id
            constraintName: fk_record_to_service_service
            deferrable: true
            initiallyDeferred: true
            onDelete: CASCADE
            onUpdate: CASCADE

    - changeSet:
        id: add-indexes-record-to-service
        author: owpk
        context: indx
        changes:
        - createIndex:
            tableName: record_to_service
            indexName: idx_record_to_service_record_id
            columns:
            - column:
                name: record_id
        - createIndex:
            tableName: record_to_service
            indexName: idx_record_to_service_service_id
            columns:
            - column:
                name: service_id