                   type: text
               - column:
                   name: record_limit
                   type: int
               - column:
                   name: time_duration
                   type: int
         - createTable:
             tableName: record
             columns:
               - column:
                   name: id
                   type: bigserial
                   constraints:
                     primaryKey: true
               - column:
                   name: service_info_id
                   type: bigint
               - column:
                   name: record_owner_id
                   type: bigint
               - column:
                   name: is_public
