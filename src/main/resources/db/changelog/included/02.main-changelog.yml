databaseChangeLog:
  - changeSet:
      id: add_price_cols
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: "service_info"
            columns:
              - column:
                  name: "price"
                  type: numeric(19,4)
                  defaultValueNumeric: 0
              - column:
                  name: is_hourly_price
                  type: boolean
                  defaultValueBoolean: false
  - changeSet:
      id: service_infos_to_pendings
      context: ddl
      author: owpk
      changes:
        - createTable:
            tableName: servcie_info_to_pending
            columns:
              - column:
                  name: service_info_id
                  type: bigint
              - column:
                  name: pending_id
                  type: bigint
  - changeSet:
      id: service_infos_to_pendings_idxs
      context: indx
      author: owpk
      changes:
        - addNotNullConstraint:
            tableName: servcie_info_to_pending
            columnName: service_info_id
        - addNotNullConstraint:
            tableName: servcie_info_to_pending
            columnName: pending_id
        - addUniqueConstraint:
            tableName: servcie_info_to_pending
            columnNames: service_info_id, pending_id
        - addPrimaryKey:
            tableName: servcie_info_to_pending
            columnNames: service_info_id, pending_id
            constraintName: pk_servcie_info_to_pending
        - addForeignKeyConstraint:
            onDelete: CASCADE
            deferrable: true
            initiallyDeferred: true
            constraintName: fk_sitp_service_info_id
            baseTableName: servcie_info_to_pending
            baseColumnNames: service_info_id
            referencedTableName: service_info
            referencedColumnNames: id
        - addForeignKeyConstraint:
            onDelete: CASCADE
            deferrable: true
            initiallyDeferred: true
            constraintName: fk_sitp_pending_id
            baseTableName: servcie_info_to_pending
            baseColumnNames: pending_id
            referencedTableName: record_pending
            referencedColumnNames: id

  - changeSet:
      id: add_profile_icon_col
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: domain_user
            columns:
              - column:
                  name: icon
                  type: text

  - changeSet:
      id: add_record_color
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: record
            columns:
              - column:
                  name: color
                  type: text

  - changeSet:
      id: change_confirmed_to_varchar20
      context: ddl
      author: owpk
      changes:
        - modifyDataType:
            tableName: record_pending
            columnName: confirmed
            newDataType: varchar(20)

  - changeSet:
        id: uq_record_pending_active
        context: indx
        author: owpk
        changes:
          - createIndex:
              indexName: uq_record_pending_active
              tableName: record_pending
              unique: true
              columns:
                - column:
                    name: record_id
                - column:
                    name: client_id
              where: "confirmed = 'CREATED'"

  - changeSet:
      id: rename_icon_to_profile_icon
      context: ddl
      author: owpk
      changes:
        - renameColumn:
            tableName: domain_user
            oldColumnName: icon
            newColumnName: profile_icon