databaseChangeLog:
  - changeSet:
      id: add_price_cols
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: "service_info"
            columns:
              - column:
                  name: "price"
                  type: numeric(19,4)
                  defaultValueNumeric: 0
              - column:
                  name: is_hourly_price
                  type: boolean
                  defaultValueBoolean: false
  - changeSet:
      id: service_infos_to_pendings
      context: ddl
      author: owpk
      changes:
        - createTable:
            tableName: servcie_info_to_pending
            columns:
              - column:
                  name: service_info_id
                  type: bigint
              - column:
                  name: pending_id
                  type: bigint
  - changeSet:
      id: service_infos_to_pendings_idxs
      context: indx
      author: owpk
      changes:
        - addNotNullConstraint:
            tableName: servcie_info_to_pending
            columnName: service_info_id
        - addNotNullConstraint:
            tableName: servcie_info_to_pending
            columnName: pending_id
        - addUniqueConstraint:
            tableName: servcie_info_to_pending
            columnNames: service_info_id, pending_id
        - addPrimaryKey:
            tableName: servcie_info_to_pending
            columnNames: service_info_id, pending_id
            constraintName: pk_servcie_info_to_pending
        - addForeignKeyConstraint:
            onDelete: CASCADE
            deferrable: true
            initiallyDeferred: true
            constraintName: fk_sitp_service_info_id
            baseTableName: servcie_info_to_pending
            baseColumnNames: service_info_id
            referencedTableName: service_info
            referencedColumnNames: id
        - addForeignKeyConstraint:
            onDelete: CASCADE
            deferrable: true
            initiallyDeferred: true
            constraintName: fk_sitp_pending_id
            baseTableName: servcie_info_to_pending
            baseColumnNames: pending_id
            referencedTableName: record_pending
            referencedColumnNames: id

  - changeSet:
      id: add_profile_icon_col
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: domain_user
            columns:
              - column:
                  name: icon
                  type: text

  - changeSet:
      id: add_record_color
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: record
            columns:
              - column:
                  name: color
                  type: text

  - changeSet:
      id: refactor_record_composite_pk_step1_add_record_id_column
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: record
            columns:
              - column:
                  name: record_id
                  type: bigint
                  remarks: "Составной ключ - id записи в пределах пользователя"
                  constraints:
                    nullable: true

  - changeSet:
      id: refactor_record_drop_fk_record_to_service
      context: ddl
      author: owpk
      preConditions:
        - onFail: MARK_RAN
        - foreignKeyConstraintExists:
            foreignKeyName: fk_record_to_service_record
      changes:
        - dropForeignKeyConstraint:
            baseTableName: record_to_service
            constraintName: fk_record_to_service_record

  - changeSet:
      id: refactor_record_drop_fk_record_pending
      context: ddl
      author: owpk
      preConditions:
        - onFail: MARK_RAN
        - foreignKeyConstraintExists:
            foreignKeyName: fk_record_pending_record_id
      changes:
        - dropForeignKeyConstraint:
            baseTableName: record_pending
            constraintName: fk_record_pending_record_id

  - changeSet:
      id: refactor_record_drop_primary_key
      context: ddl
      author: owpk
      preConditions:
        - onFail: MARK_RAN
        - primaryKeyExists:
            tableName: record
            constraintName: record_pkey
      changes:
        - dropPrimaryKey:
            tableName: record
            constraintName: record_pkey

  - changeSet:
      id: refactor_record_composite_pk_step4_add_not_null_and_new_pk
      context: ddl
      author: owpk
      changes:
        - addNotNullConstraint:
            tableName: record
            columnName: record_id
        - addPrimaryKey:
            tableName: record
            columnNames: record_owner_id, record_id
            constraintName: pk_record_composite

  - changeSet:
      id: refactor_record_composite_pk_step6_update_record_to_service
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: record_to_service
            columns:
              - column:
                  name: record_owner_id
                  type: bigint
                  remarks: "Часть составного ключа для связи с record"
                  constraints:
                    nullable: true
        - addNotNullConstraint:
            tableName: record_to_service
            columnName: record_owner_id
        - dropPrimaryKey:
            tableName: record_to_service
            constraintName: pk_record_to_service
        - addPrimaryKey:
            tableName: record_to_service
            columnNames: record_owner_id, record_id, service_id
            constraintName: pk_record_to_service_composite

  - changeSet:
      id: refactor_record_composite_pk_step7_update_record_pending
      context: ddl
      author: owpk
      changes:
        - addColumn:
            tableName: record_pending
            columns:
              - column:
                  name: record_owner_id
                  type: bigint
                  remarks: "Часть составного ключа для связи с record"
                  constraints:
                    nullable: true
        - addNotNullConstraint:
            tableName: record_pending
            columnName: record_owner_id
        - addForeignKeyConstraint:
            baseTableName: record_pending
            baseColumnNames: record_owner_id, record_id
            referencedTableName: record
            referencedColumnNames: record_owner_id, record_id
            constraintName: fk_record_pending_record_id_composite
            onDelete: CASCADE

  - changeSet:
      id: refactor_record_composite_pk_step5_recreate_fk
      context: indx
      author: owpk
      changes:
        - addForeignKeyConstraint:
            baseTableName: record_to_service
            baseColumnNames: record_owner_id, record_id
            referencedTableName: record
            referencedColumnNames: record_owner_id, record_id
            constraintName: fk_record_to_service_record
            deferrable: true
            initiallyDeferred: true
            onDelete: CASCADE
            onUpdate: CASCADE

  - changeSet:
      id: refactor_record_create_record_id_trigger
      context: fn
      author: owpk
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Функция генерирует record_id в пределах record_owner_id
              -- с защитой через advisory lock
              CREATE OR REPLACE FUNCTION public.gen_record_id()
              RETURNS trigger AS $$
              DECLARE
                  next_id bigint;
              BEGIN
                  IF NEW.record_id IS NOT NULL THEN
                      RETURN NEW;
                  END IF;

                  -- блокируем по owner id на уровне транзакции, чтобы избежать гонок
                  PERFORM pg_advisory_xact_lock(NEW.record_owner_id::bigint);

                  SELECT COALESCE(MAX(record_id), 0) + 1
                    INTO next_id
                    FROM record
                   WHERE record_owner_id = NEW.record_owner_id;

                  NEW.record_id := next_id;
                  RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
        - sql:
            sql: |
              -- Триггер для установки record_id при вставке
              DROP TRIGGER IF EXISTS tr_gen_record_id ON public.record;
              CREATE TRIGGER tr_gen_record_id
              BEFORE INSERT ON public.record
              FOR EACH ROW
              EXECUTE FUNCTION public.gen_record_id();

  - changeSet:
      id: refactor_record_drop_old_id_column
      context: ddl
      author: owpk
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: record
            columnName: id
      changes:
        - dropColumn:
            tableName: record
            columnName: id
