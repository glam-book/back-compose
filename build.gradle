buildscript {
    ext {
        springBootVersion = '3.4.1'
    }
}

plugins {
	id 'java'
	id 'com.diffplug.eclipse.apt' version '4.3.0'
  	id 'eclipse'

	id 'io.spring.dependency-management' version '1.1.7' apply false
	id 'org.springframework.boot' version "${springBootVersion}" apply false
}

allprojects {
	group = 'com.tlback'
	version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
	apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

	dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'

		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		implementation 'io.vavr:vavr:0.10.4'
    }
}

// Develop configs
task generateEclipseConfig {
  	dependsOn ':tl-core:generateJooq', 'eclipse', 'eclipseJdt', 'eclipseJdtApt'
}

eclipse {
   	project {
    	name = rootProject.name
  }
  jdt {
	file {
      	withProperties { props ->
        	props['org.eclipse.jdt.core.compiler.codegen.methodParameters'] = 'generate'
      	}
    }
    apt {
      		genSrcDir = 'build/generated/sources/annotationProcessor/java/main'
      		genTestSrcDir = 'build/generated/sources/annotationProcessor/java/test'
      		reconcileEnabled = true
    	}
  	}
  	synchronizationTasks generateEclipseConfig
}

