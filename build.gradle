plugins {
	id 'java'
	id 'com.diffplug.eclipse.apt' version '4.3.0'
  	id 'eclipse'
}

allprojects {
	group = 'com.tlback'
	version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

subprojects {
	apply plugin: 'java'

	java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

	dependencies {
		compileOnly 'org.projectlombok:lombok:1.18.38'
		annotationProcessor 'org.projectlombok:lombok:1.18.38'
		implementation 'io.vavr:vavr:0.10.4'
    }
}

// Develop configs
task generateEclipseConfig {
  	dependsOn ':tl-core:generateJooq', 'eclipse', 'eclipseJdt', 'eclipseJdtApt'
}

eclipse {
   	project {
    	name = rootProject.name
  }
  jdt {
	file {
      	withProperties { props ->
        	props['org.eclipse.jdt.core.compiler.codegen.methodParameters'] = 'generate'
      	}
    }
    apt {
      		genSrcDir = 'build/generated/sources/annotationProcessor/java/main'
      		genTestSrcDir = 'build/generated/sources/annotationProcessor/java/test'
      		reconcileEnabled = true
    	}
  	}
  	synchronizationTasks generateEclipseConfig
}

