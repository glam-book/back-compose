plugins {
	id 'com.diffplug.eclipse.apt' version '4.3.0'
  	id 'eclipse'

	id 'java'
	id 'org.springframework.boot' version '3.4.1' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
	apply plugin: 'java'

	group = 'com.tlback'
	version = '0.0.1-SNAPSHOT'

	java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

	dependencies {
		compileOnly 'org.projectlombok:lombok:1.18.38'
		annotationProcessor 'org.projectlombok:lombok:1.18.38'
		implementation 'io.vavr:vavr:0.10.4'
    }

	configurations {
	  compileOnly {
	    extendsFrom annotationProcessor
	  }
	}
}

allprojects {
	apply plugin: 'com.diffplug.eclipse.apt'
	apply plugin: 'eclipse'

    repositories {
        mavenCentral()
    }

	eclipse {
	   	project {
	    	name = rootProject.name
	  }
	  jdt {
		file {
	      	withProperties { props ->
	        	props['org.eclipse.jdt.core.compiler.codegen.methodParameters'] = 'generate'
	      	}
	    }
	    apt {
	      		genSrcDir = 'build/generated/sources/annotationProcessor/java/main'
	      		genTestSrcDir = 'build/generated/sources/annotationProcessor/java/test'
	      		reconcileEnabled = true
	    	}
	  	}
	}
}

var tlcore = project(":tl-core")
var tltg = project(":tl-tg-bot")

configure tlcore, {
	dependencies {
		implementation tltg
	}
}

// Develop configs
task generateEclipseConfig {
  	dependsOn 'cleanEclipse', ':tl-core:generateJooq', 'eclipse', 'eclipseJdt', 'eclipseJdtApt'
}

task bootJar(type: Copy) {
    dependsOn ':tl-core:bootJar'
    from("$rootDir/tl-core/build/libs/") {
        include '*.jar'
    }
    into "$rootDir/build/libs"
    rename { String fileName ->
        // Переименовать jar, чтобы было понятно, что это root-jar
        fileName.replace('tl-core', rootProject.name)
    }
}